<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Тапалка</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      background:
        radial-gradient(circle at top, #35418b 0, transparent 42%),
        #101426;
    }

    .app {
      width: min(100%, 420px);
      margin: 0 auto;
      padding-top: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 32px;
      color: #b8c0e0;
    }

    .score-card,
    .energy-card {
      padding: 18px;
      border: 1px solid #ffffff1c;
      border-radius: 20px;
      background: #ffffff0d;
    }

    .score-label,
    .energy-label {
      color: #b8c0e0;
      font-size: 14px;
    }

    #score {
      margin-top: 6px;
      font-size: 42px;
      font-weight: 700;
    }

    .coin-button {
      display: grid;
      width: 230px;
      height: 230px;
      margin: 30px auto;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #553600;
      font-size: 100px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      background: linear-gradient(145deg, #ffe77a, #ffab21);
      box-shadow: 0 12px 0 #bd6d12, 0 20px 45px #0005;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .coin-button:active {
      transform: translateY(8px) scale(0.97);
      box-shadow: 0 4px 0 #bd6d12, 0 12px 28px #0005;
    }

    .coin-button:disabled {
      cursor: not-allowed;
      filter: grayscale(0.6);
      opacity: 0.65;
    }

    .energy-card {
      text-align: left;
    }

    .energy-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .bar {
      height: 12px;
      overflow: hidden;
      border-radius: 99px;
      background: #ffffff20;
    }

    #energyBar {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #42e695, #3bb2ff);
      transition: width 0.2s;
    }

    #hint {
      min-height: 20px;
      margin-top: 18px;
      color: #b8c0e0;
      font-size: 14px;
    }

    .reset {
      margin-top: 24px;
      padding: 10px 14px;
      border: 1px solid #ffffff30;
      border-radius: 10px;
      color: #c8cdea;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Моя тапалка</h1>
    <p class="subtitle">Нажимай на монету и собирай очки</p>

    <section class="score-card">
      <div class="score-label">ТВОИ МОНЕТЫ</div>
      <div id="score">0</div>
    </section>

    <button class="coin-button" id="tapButton" aria-label="Нажать">
      🪙
    </button>

    <section class="energy-card">
      <div class="energy-row">
        <span class="energy-label">Энергия</span>
        <span id="energyText">100 / 100</span>
      </div>
      <div class="bar">
        <div id="energyBar"></div>
      </div>
    </section>

    <div id="hint">Каждое нажатие даёт 1 монету</div>

    <button class="reset" id="resetButton">Сбросить прогресс</button>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    const MAX_ENERGY = 100;
    const REGEN_PER_SECOND = 1;
    const STORAGE_KEY = "myTelegramTapper";

    const scoreElement = document.getElementById("score");
    const energyText = document.getElementById("energyText");
    const energyBar = document.getElementById("energyBar");
    const tapButton = document.getElementById("tapButton");
    const hint = document.getElementById("hint");

    function loadGame() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

        if (saved) {
          const now = Date.now();
          const secondsPassed = Math.max(0, (now - saved.lastTime) / 1000);
          const recoveredEnergy = Math.floor(secondsPassed * REGEN_PER_SECOND);

          return {
            score: Math.max(0, Number(saved.score) || 0),
            energy: Math.min(
              MAX_ENERGY,
              Math.max(0, (Number(saved.energy) || 0) + recoveredEnergy)
            )
          };
        }
      } catch (error) {
        console.log("Не удалось загрузить сохранение");
      }

      return { score: 0, energy: MAX_ENERGY };
    }

    const game = loadGame();

    function saveGame() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        score: game.score,
        energy: game.energy,
        lastTime: Date.now()
      }));
    }

    function render() {
      scoreElement.textContent = game.score.toLocaleString("ru-RU");
      energyText.textContent = `${game.energy} / ${MAX_ENERGY}`;
      energyBar.style.width = `${(game.energy / MAX_ENERGY) * 100}%`;
      tapButton.disabled = game.energy < 1;

      if (game.energy < 1) {
        hint.textContent = "Энергия закончилась — она постепенно восстановится";
      } else {
        hint.textContent = "Каждое нажатие даёт 1 монету";
      }
    }

    tapButton.addEventListener("click", () => {
      if (game.energy < 1) return;

      game.score += 1;
      game.energy -= 1;

      tg?.HapticFeedback?.impactOccurred("light");

      saveGame();
      render();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      const confirmed = confirm("Точно сбросить весь прогресс?");

      if (!confirmed) return;

      game.score = 0;
      game.energy = MAX_ENERGY;
      saveGame();
      render();
    });

    setInterval(() => {
      if (game.energy < MAX_ENERGY) {
        game.energy = Math.min(
          MAX_ENERGY,
          game.energy + REGEN_PER_SECOND
        );
        saveGame();
        render();
      }
    }, 1000);

    render();
  </script>
</body>
</html>
